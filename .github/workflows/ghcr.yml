name: Publish to GHCR

# Builds the main image for the latest stable OctoPrint release and pushes it to
# ghcr.io/<owner>/octoprint. Runs on pushes to master, monthly (full rebuild
# without cache to pick up base image and security updates), weekly (only when
# a new OctoPrint release is not yet published) and on demand.
on:
  push:
    branches:
      - master
  schedule:
    - cron: "17 4 1 * *"  # monthly full rebuild
    - cron: "17 4 * * 1"  # weekly check for a new OctoPrint release
  workflow_dispatch:
    inputs:
      octoprint_ref:
        description: "OctoPrint tag to build (empty = latest stable release)"
        required: false
        default: ""

# One build at a time: when the 1st of the month is a Monday, the weekly check
# waits for the monthly rebuild and then finds the release already published.
concurrency:
  group: ghcr-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pick OctoPrint version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="${{ github.event.inputs.octoprint_ref }}"
          if [ -z "$ref" ]; then
            # latest stable release (no prereleases, no drafts)
            ref=$(gh api repos/OctoPrint/OctoPrint/releases/latest --jq .tag_name)
          fi
          [ -n "$ref" ] || { echo "could not determine OctoPrint version"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Building OctoPrint $ref"

      - name: Image name (lowercase owner)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/octoprint" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this release is already published (weekly check)
        id: check
        run: |
          if [ "${{ github.event.schedule }}" = "17 4 * * 1" ] \
            && docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ steps.version.outputs.ref }}" >/dev/null 2>&1; then
            echo "OctoPrint ${{ steps.version.outputs.ref }} is already published, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ github.event.schedule == '17 4 1 * *' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            octoprint_ref=${{ steps.version.outputs.ref }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.ref }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.ref }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
